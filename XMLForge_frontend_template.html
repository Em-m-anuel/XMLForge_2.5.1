<!DOCTYPE html>
<!-- ============================================================
  XMLForge — Modèle frontend autonome (HTML/CSS/JS)
  ------------------------------------------------------------
  Représente l'INTÉGRALITÉ du frontend fonctionnel de XMLForge :
  - Login / Register
  - Dashboard (bases PERSONAL / COMMON, partage, import/export)
  - Workspace (structure, données, relations, XML, SQL, sync, protection)
  - Utilisateurs (ADMIN), Historique (ADMIN), Audit (ADMIN)
  - API & TCP/IP (statut serveur, credentials, endpoints)

  Ce fichier est un MODÈLE VISUEL : il est volontairement lisible et
  modifiable. Toutes les actions appellent les VRAIS endpoints du
  backend Flask (aucune donnée fictive). Aucun mock n'est embarqué.

  CONFIG : la constante API_URL ci-dessous pointe vers le backend.
  En développement React, Vite proxyfie /api vers http://localhost:5000.
  Fichier autonome => utiliser l'URL complète du backend.
============================================================ -->
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XMLForge — Frontend</title>
<style>
/* ============================================================
   DESIGN TOKENS (identiques à maquette.css)
============================================================ */
:root{
  --bg:#0F1117; --bg-elevated:#13161D; --sidebar:#171B22; --card:#1C212B;
  --card-hover:#232A37; --border:#262C38; --border-soft:#20252F;
  --accent:#3B82F6; --accent-dim:#3B82F630; --accent-soft:#3B82F615;
  --success:#22C55E; --success-soft:#22C55E18; --danger:#EF4444; --danger-soft:#EF444418;
  --warn:#FFD86B; --warn-soft:#FFD86B12;
  --text:#fff; --text-secondary:#A0AEC0; --text-tertiary:#5B6472;
  --font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --radius-sm:6px; --radius:10px; --radius-lg:16px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font-ui);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2A303C;border-radius:10px}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
.hidden{display:none!important}
.mono{font-family:var(--font-mono)}

/* Boutons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;transition:.18s}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn:hover{background:var(--card-hover);border-color:#333b4a}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:#4C8DF7}
.btn-danger{background:var(--danger-soft);border-color:#EF444440;color:#FF8787}
.btn-danger:hover{background:#EF444430}
.btn-sm{padding:6px 11px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--text-secondary);flex-shrink:0}
.icon-btn svg{width:16px;height:16px}
.icon-btn:hover{background:var(--card-hover);color:var(--text);border-color:var(--border)}
.icon-btn.danger:hover{background:var(--danger-soft);color:#FF8787}
.icon-btn.sm{width:26px;height:26px}
.icon-btn.sm svg{width:14px;height:14px}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-blue{background:var(--accent-soft);color:#7CACFB}
.badge-green{background:var(--success-soft);color:#5EE29A}
.badge-gray{background:#A0AEC018;color:var(--text-secondary)}
.badge-red{background:var(--danger-soft);color:#FF8787}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-dot{width:6px;height:6px;border-radius:50%}

/* Formulaires */
.form-input{width:100%;background:#12151C;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--text);font-family:inherit;outline:none;resize:vertical}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.form-label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:7px}
.field-block{margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
select.form-input{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235B6472' stroke-width='2'><path d='m6 9 6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px}
.check-row{display:flex;align-items:center;gap:9px;padding:9px 0}
.check-row label{font-size:13px;cursor:pointer}
.switch{position:relative;width:36px;height:20px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch .track{position:absolute;inset:0;background:#2A303C;border-radius:100px;transition:.18s}
.switch .track::before{content:'';position:absolute;width:15px;height:15px;left:2.5px;top:2.5px;background:#fff;border-radius:50%;transition:.18s}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::before{transform:translateX(16px)}

/* États */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;color:var(--text-tertiary);text-align:center;gap:8px}
.empty-state svg{width:34px;height:34px;opacity:.6}
.es-title{font-size:15px;font-weight:600;color:var(--text-secondary)}
.es-desc{font-size:13px;max-width:340px}
.skeleton{background:linear-gradient(90deg,var(--card) 25%,var(--card-hover) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--radius)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.mini-spinner{width:13px;height:13px;border-radius:50%;border:2px solid var(--accent-dim);border-top-color:var(--accent);animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Boîtes info / danger */
.danger-box{background:var(--danger-soft);border:1px solid #EF444440;border-radius:var(--radius);padding:14px 16px;font-size:13px;color:#FFB4B4;line-height:1.6}
.danger-box b{color:#fff}
.info-box{background:var(--accent-soft);border:1px solid #3B82F640;border-radius:var(--radius);padding:14px 16px;font-size:13px;color:#B9D3FC;line-height:1.6;margin-bottom:16px;display:flex;gap:10px}
.info-box svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:#7CACFB}

/* ============================================================
   LAYOUT GÉNÉRAL
============================================================ */
#app{height:100vh;width:100vw;display:flex}
.screen{display:none;height:100vh;width:100vw}
.screen.active{display:flex}

/* ============================================================
   LOGIN / REGISTER
============================================================ */
#screen-login,#screen-register{align-items:center;justify-content:center;position:relative;overflow:hidden;background:radial-gradient(circle at 15% 20%,rgba(59,130,246,.16),transparent 40%),radial-gradient(circle at 85% 80%,rgba(34,197,94,.08),transparent 45%),var(--bg)}
.auth-bg{position:absolute;inset:0;opacity:.35;font-family:var(--font-mono);font-size:13px;color:#3B82F6;overflow:hidden;user-select:none}
.login-card{position:relative;z-index:2;width:400px;max-width:92vw;padding:40px 36px 32px;background:rgba(28,33,43,.72);border:1px solid var(--border);border-radius:var(--radius-lg);backdrop-filter:blur(20px);box-shadow:0 12px 40px -8px rgba(0,0,0,.6)}
.login-logo{width:44px;height:44px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#3B82F6,#2563EB);border-radius:12px}
.login-logo svg{width:24px;height:24px;color:#fff}
.login-title{text-align:center;font-size:20px;font-weight:700;margin:0 0 4px}
.login-sub{text-align:center;font-size:13px;color:var(--text-secondary);margin:0 0 28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-secondary);margin-bottom:7px}
.field-input{display:flex;align-items:center;gap:10px;background:#12151C;border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px}
.field-input:focus-within{border-color:var(--accent)}
.field-input svg{width:16px;height:16px;color:var(--text-tertiary);flex-shrink:0}
.field-input input{border:none;outline:none;background:transparent;color:var(--text);font-size:13.5px;width:100%;font-family:inherit}
.login-btn{width:100%;justify-content:center;padding:11px;margin-top:6px}
.login-footer{text-align:center;font-size:12.5px;color:var(--text-secondary);margin-top:20px}
.login-footer a{color:#7CACFB;font-weight:600;text-decoration:underline;cursor:pointer}
.login-error{display:flex;gap:9px;background:var(--danger-soft);border:1px solid #EF444440;color:#FF8787;font-size:12.5px;padding:11px 13px;border-radius:var(--radius);margin-bottom:16px}

/* ============================================================
   SIDEBAR
============================================================ */
.sidebar{width:224px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;padding:16px 12px}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:6px 8px 20px}
.sidebar-logo .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(145deg,#3B82F6,#2563EB);display:flex;align-items:center;justify-content:center}
.sidebar-logo .mark svg{width:16px;height:16px;color:#fff}
.sidebar-logo span{font-weight:700;font-size:14.5px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:13px;font-weight:500;cursor:pointer}
.nav-item svg{width:16px;height:16px}
.nav-item:hover{background:var(--card);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:#7CACFB}
.sidebar-spacer{flex:1}
.sidebar-bottom{border-top:1px solid var(--border-soft);padding-top:10px}
.sidebar-user{padding:6px 10px 10px;font-size:11px;color:var(--text-tertiary)}
.sidebar-user b{color:var(--text-secondary)}

/* ============================================================
   DASHBOARD
============================================================ */
.dash-main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--border-soft)}
.topbar-search{display:flex;align-items:center;gap:9px;background:#12151C;border:1px solid var(--border);border-radius:8px;padding:8px 12px;width:340px;max-width:40vw}
.topbar-search svg{width:15px;height:15px;color:var(--text-tertiary)}
.topbar-search input{border:none;outline:none;background:transparent;color:var(--text);font-size:13px;width:100%}
.topbar-right{display:flex;align-items:center;gap:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#3B82F6,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff}
.page-header{height:48px;flex-shrink:0;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--border-soft)}
.back-link{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-secondary);cursor:pointer}
.back-link svg{width:15px;height:15px}
.dash-content{flex:1;overflow:auto;padding:28px}
.dash-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.dash-head h1{margin:0 0 4px;font-size:22px}
.dash-head p{margin:0;font-size:13px;color:var(--text-secondary)}
.dash-actions{display:flex;gap:10px;flex-wrap:wrap}
.tabs-seg{display:inline-flex;background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.tab-btn{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:8px;border:none;background:transparent;color:var(--text-secondary);font-size:12.5px;font-weight:500}
.tab-btn svg{width:14px;height:14px}
.tab-btn.active{background:var(--card-hover);color:var(--text)}
.db-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.db-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;display:flex;flex-direction:column;gap:10px;transition:.18s;position:relative}
.db-card:hover{border-color:#333b4a;transform:translateY(-2px)}
.db-card.archived{opacity:.6}
.db-card-top{display:flex;align-items:center;justify-content:space-between}
.db-card-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:#7CACFB}
.db-card-icon svg{width:19px;height:19px}
.ctx-wrap{position:relative}
.ctx-menu{position:absolute;right:0;top:34px;z-index:50;min-width:210px;background:var(--card-hover);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 12px 40px -8px rgba(0,0,0,.6);display:none;padding:6px}
.ctx-menu.open{display:block}
.ctx-menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border:none;background:transparent;color:var(--text);font-size:12.5px;border-radius:6px;text-align:left}
.ctx-menu button svg{width:14px;height:14px}
.ctx-menu button:hover{background:var(--card)}
.ctx-menu button.danger{color:#FF8787}
.ctx-menu hr{border:none;border-top:1px solid var(--border-soft);margin:5px 0}
.db-card h3{margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-card .desc{font-size:12.5px;color:var(--text-secondary);min-height:18px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db-card .meta{font-size:11.5px;color:var(--text-secondary);display:flex;gap:6px;align-items:center}
.db-card .meta .dim{color:var(--text-tertiary)}
.db-card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;border-top:1px solid var(--border-soft);padding-top:12px}
.db-card-badges{display:flex;gap:6px}
.db-card-open{display:inline-flex;align-items:center;gap:6px;color:#7CACFB;font-weight:600;font-size:12.5px;cursor:pointer}
.db-card-open svg{width:14px;height:14px}

/* ============================================================
   WORKSPACE
============================================================ */
.ws-titlebar{height:56px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border-soft)}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary)}
.back-btn svg{width:15px;height:15px}
.ws-crumb{font-size:13px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-crumb b{color:var(--text)}
.ws-titlebar-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
.ws-body{flex:1;display:flex;min-height:0}
.ws-sidebar{width:230px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border-soft);display:flex;flex-direction:column;padding:14px 10px;overflow:auto}
.ws-sidebar-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary);padding:0 8px 8px}
.ws-table-list{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.ws-table-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:12.5px;cursor:pointer}
.ws-table-item svg{width:15px;height:15px;flex-shrink:0}
.ws-table-item:hover{background:var(--card);color:var(--text)}
.ws-table-item.active{background:var(--accent-soft);color:#7CACFB}
.ws-table-item .name-wrap{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.ws-table-item .name-wrap>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-table-item .count{margin-left:auto;font-size:11px;color:var(--text-tertiary)}
.arch-tag{font-size:9px;color:var(--text-tertiary);border:1px solid var(--border);border-radius:4px;padding:1px 4px}
.lock-ic{color:var(--warn);display:inline-flex}
.lock-ic.unlocked{color:var(--success)}
.ws-sidebar-actions{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--border-soft);padding-top:10px;margin-top:8px}
.ws-main{flex:1;display:flex;flex-direction:column;min-width:0}
.db-overview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border-soft);background:var(--bg-elevated);font-size:12px;color:var(--text-secondary)}
.db-overview b{color:var(--text)}
.db-overview .dim{color:var(--text-tertiary)}
.ws-main-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.ws-main-head-left{display:flex;align-items:center;gap:12px;min-width:0}
.ws-main-head-left>svg{width:22px;height:22px;color:#7CACFB;flex-shrink:0}
.ws-main-head-left h2{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.ws-main-head-left .sub{font-size:11.5px;color:var(--text-tertiary);margin-top:3px}
.ws-main-actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs-row{padding:0 20px;border-bottom:1px solid var(--border-soft);display:flex;gap:18px}
.tabs-row .tabs-seg{border:none;border-radius:0;background:transparent;padding:0;margin-bottom:-1px}
.tabs-row .tab-btn{border-radius:0;border-bottom:2px solid transparent;padding:12px 16px}
.tabs-row .tab-btn.active{border-bottom-color:var(--accent);background:transparent;color:#7CACFB}
.tab-panel{display:none;flex:1;overflow:auto;min-height:0}
.tab-panel.active{display:block}
.table-wrap{overflow:auto;height:100%}
.cols-table{width:100%;border-collapse:collapse;font-size:12.5px}
.cols-table thead th{text-align:left;padding:10px 12px;color:var(--text-tertiary);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);white-space:nowrap}
.cols-table tbody tr:hover{background:var(--card)}
.cols-table td{padding:11px 12px;border-bottom:1px solid var(--border-soft)}
.cols-table td.date-cell,.cols-table td.ip-cell{font-family:var(--font-mono);color:var(--text-tertiary);font-size:11.5px;white-space:nowrap}
.col-name{font-weight:600}
.col-type{font-family:var(--font-mono);color:#7CACFB;font-size:11.5px}
.pk-tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;background:var(--warn-soft);color:var(--warn);font-size:10px;font-weight:700}
.fk-tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:#7CACFB;font-size:10px;font-weight:700}
.chip{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px}
.chip svg{width:13px;height:13px}
.chip.yes{background:var(--success-soft);color:var(--success)}
.chip.no{color:var(--text-tertiary)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.data-tab-wrap{display:flex;flex-direction:column;height:100%}
.filters-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.filters-bar .form-input{width:auto}
/* Relations */
.rel-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-tertiary);margin:22px 0 10px}
.rel-section-title:first-child{margin-top:0}
.rel-current-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.rel-current-name{font-size:14.5px;font-weight:700}
.rel-current-sub{font-size:12px;color:var(--text-secondary);margin-top:2px}
.rel-list{display:flex;flex-direction:column;gap:8px}
.rel-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);padding:10px 14px;font-size:12.5px}
.rel-row-col{font-family:var(--font-mono);font-weight:600}
.rel-row-target{font-family:var(--font-mono);color:#7CACFB}

/* Panneaux code XML / SQL */
.ws-right{width:380px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border-soft);background:var(--bg-elevated)}
.code-pane{display:flex;flex-direction:column;flex:1;min-height:0;border-bottom:1px solid var(--border-soft)}
.code-pane-head{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;font-weight:600;color:var(--text-secondary);flex-shrink:0}
.code-pane-head svg{width:15px;height:15px}
.lang-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:#7CACFB;font-family:var(--font-mono)}
.code-pane-head-actions{display:flex;gap:4px;margin-left:auto}
.code-pane-body{flex:1;min-height:0;padding:0}

============================================================ */

/* ============================================================
   CLIENT API (même sémantique que src/services/api.js)
============================================================ */
function getToken(){ return storage.get('xmlforge_token'); }
function setToken(t){ storage.set('xmlforge_token', t); }

function decodeToken(token){
  try {
    const payload = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    return JSON.parse(decodeURIComponent(atob(payload).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  } catch(e){ return null; }
}
function isTokenExpired(token){
  token = token || getToken();
  if(!token) return true;
  const p = decodeToken(token);
  return !p || !p.exp || p.exp*1000 <= Date.now();
}
function clearSession(){
  storage.del('xmlforge_token');
  storage.del('xmlforge_user');
}

function friendlyMessage(status, payload){
  if (payload && payload.message) return payload.message;
  if (status === 401) return 'Session expirée. Veuillez vous reconnecter.';
  if (status === 403) return 'Vous ne disposez pas des droits nécessaires.';
  if (status === 404) return 'La ressource demandée est introuvable.';
  if (status === 409) return 'Cette base a été modifiée depuis votre dernière synchronisation.';
  if (status === 400 || status === 422) return 'Les données envoyées sont invalides.';
  if (status >= 500) return 'Le serveur XMLForge a rencontré une erreur.';
  return 'Erreur HTTP ' + status;
}

async function api(path, { method='GET', body, withAuth=true, raw=false, headers: custom = {} } = {}){
  const token = getToken();
  if (withAuth && token && isTokenExpired(token)){
    clearSession();
    render();
    throw { status:401, message:'Session expirée. Veuillez vous reconnecter.', isConflict:false };
  }
  const isForm = (typeof FormData !== 'undefined') && body instanceof FormData;
  const headers = { ...custom };
  if (withAuth && token) headers['Authorization'] = 'Bearer ' + token;
  if (!isForm && body !== undefined) headers['Content-Type'] = 'application/json';
  let response;
  try {
    response = await fetch(API_URL + (path.startsWith('/')?path:'/'+path), {
      method, headers, body: (body === undefined ? undefined : isForm ? body : JSON.stringify(body))
    });
  } catch(e){
    throw { status:0, message:'Impossible de joindre le backend XMLForge (' + API_URL + ').', isConflict:false };
  }
  if (raw && response.ok) return response;
  let payload = null;
  try { payload = await response.json(); } catch(e){ payload = null; }
  if (response.status === 401 && withAuth){ clearSession(); render(); }
  if (!response.ok){
    throw { status: response.status, message: friendlyMessage(response.status, payload), isConflict: response.status === 409, payload };
  }
  return payload ? payload.data : null;
}
function apiBlob(path, filename){
  return api(path, { raw:true }).then(async r => {
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    return true;
  });
}

/* ============================================================
   ÉTAT GLOBAL
============================================================ */
const App = {
  route: 'login',
  user: null,
  loading: false,
  // Dashboard
  databases: [], search:'', scopeFilter:'all', openCtx:null,
  // Workspace
  db:null, tables:[], currentTable:null, columns:[], rows:[], rowsTotal:0,
  page:1, pageSize:25, rowSearch:'', rowSort:'', rowOrder:'ASC', tab:'structure',
  documentVersion:null, xmlCode:'', sqlCode:'', xmlError:null, relationColumns:{},
  unlocked: [],
  // modals & forms
  colForm:null, rowForm:null, newTableForm:null,
  importKind:'xml', exportTarget:null,
  dbPermissions:[], tablePermissions:[]
};

function isAdmin(){ return App.roles && App.roles.includes('ADMIN'); }
function extractRoles(user){
  if (!user) return [];
  if (Array.isArray(user.roles) && user.roles.length) return user.roles.map(r=>String(r).toUpperCase());
  if (user.role) return [String(user.role).toUpperCase()];
  if (user.is_admin === true) return ['ADMIN'];
  return ['USER'];
}
function accessLevel(entity){
  return (entity && entity.access && entity.access.level) || (entity && entity.is_owner ? 'MANAGE' : 'NONE');
}
function levelBadge(rights){
  if (rights.can_admin) return 'MANAGE';
  if (rights.can_write || rights.can_ddl) return 'EDIT';
  if (rights.can_read) return 'VIEW';
  return 'NONE';
}

/* ============================================================
   TOASTS
============================================================ */
function notify(type, title, msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = '<div class="ic">' + (type==='success'?IC.check:type==='error'?IC.err:IC.info) + '</div>' +
    '<div class="txt"><b></b><span></span></div>';
  el.querySelector('b').textContent = title;
  el.querySelector('span').textContent = msg || '';
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(30px)'; el.style.transition='.25s'; }, 3400);
  setTimeout(()=>{ el.remove(); }, 3700);
}

/* ============================================================
   MODALS
============================================================ */
function openModal(html, wide){
  const root = document.getElementById('modal-root');
  root.innerHTML = '<div class="modal-overlay open" onclick="if(event.target===this)closeModal()"><div class="modal '+(wide?'modal-wide':'')+'">'+html+'</div></div>';
}
function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

/* ============================================================
   ROUTEUR / RENDU
============================================================ */
function navigate(route){
  App.route = route; render();
  if (route === 'dashboard') App.loadDatabases();
  else if (route === 'users') App.loadUsers();
  else if (route === 'audit') App.loadAudit();
  else if (route === 'history') App.loadHistory();
  else if (route === 'settings') App.loadTcp();
}

function render(){
  const app = document.getElementById('app');
  if (App.loading){ app.innerHTML = center('<span class="mini-spinner"></span> Chargement...'); return; }
  switch(App.route){
    case 'login': app.innerHTML = renderLogin(); break;
    case 'register': app.innerHTML = renderRegister(); break;
    case 'dashboard': app.innerHTML = renderDashboard(); break;
    case 'workspace': app.innerHTML = renderWorkspace(); break;
    case 'users': app.innerHTML = isAdmin() ? renderUsers() : forbidden(); break;
    case 'audit': app.innerHTML = isAdmin() ? renderAudit() : forbidden(); break;
    case 'history': app.innerHTML = isAdmin() ? renderHistory() : forbidden(); break;
    case 'settings': app.innerHTML = renderSettings(); break;
    default: app.innerHTML = renderLogin();
  }
  // Synchroniser les éditeurs de code après chaque rendu
  const xe = document.getElementById('xml-editor');
  if (xe && xe.value !== (App.xmlCode || '')) xe.value = App.xmlCode || '';
  const se = document.getElementById('sql-editor');
  if (se && se.value !== (App.sqlCode || '')) se.value = App.sqlCode || '';
}
function center(inner){ return '<div style="height:100vh;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-secondary);font-size:13px">'+inner+'</div>'; }
function forbidden(){ return '<div style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px"><div style="font-size:48px">🔒</div><div style="font-size:16px;font-weight:600">Accès refusé</div><div style="font-size:13px;color:var(--text-secondary);max-width:340px;text-align:center">Cette page nécessite le rôle ADMIN attribué par le backend.</div><button class="btn btn-primary" onclick="navigate(\'dashboard\')">Retour Dashboard</button></div>'; }

/* ============================================================
   SIDEBAR (partagé)
============================================================ */
function sidebar(active){
  const u = App.user || {};
  const nav = [
    ['databases','Bases de données', IC.db, "navigate('dashboard')"],
    ['history','Historique', IC.clock, "navigate('history')"],
    ['api','API & TCP/IP', IC.plug, "navigate('settings')"],
    ['users','Utilisateurs', IC.users, "navigate('users')"],
    ['audit','Audit', IC.shield, "navigate('audit')"],
  ];
  let items = '';
  nav.forEach(([key,label,icon,fn]) => {
    if ((key==='history'||key==='users'||key==='audit') && !isAdmin()) return;
    items += '<a class="nav-item '+(active===key?'active':'')+'" onclick="'+fn+'"><span>'+icon+'</span><span>'+label+'</span></a>';
  });
  items += '<a class="nav-item" onclick="" style="opacity:.5" title="Aucune navigation — page visuelle"><span>'+IC.gear+'</span><span>Paramètres</span></a>';

/* ============================================================
   AUTH
============================================================ */
async function boot(){
  App.loading = true; render();
  const token = getToken();
  if (token && !isTokenExpired(token)){
    try {
      const me = await api('/me');
      App.user = me; App.roles = extractRoles(me);
      storage.set('xmlforge_user', JSON.stringify(me));
      await App.loadUnlocks();
      App.route = 'dashboard';
      App.loading = false; render();
      App.loadDatabases();
      return;
    } catch(e){ clearSession(); }
  } else {
    if (token) clearSession();
  }
  App.route = 'login';
  App.loading = false; render();
}
App.login = async function(){
  const email = val('login-email'); const password = val('login-pass');
  if (!email || !password){ notify('error','Champs requis','Email et mot de passe obligatoires'); return; }
  App.loading = true; render();
  try {
    const data = await api('/login', { method:'POST', body:{ email, password }, withAuth:false });
    setToken(data.access_token);
    storage.set('xmlforge_user', JSON.stringify(data.user));
    App.user = data.user; App.roles = extractRoles(data.user);
    await App.loadUnlocks();
    App.loading = false;
    App.route = 'dashboard';
    notify('success','Connexion réussie','Bienvenue sur XMLForge');
    App.loadDatabases();
    return;
  } catch(e){ notify('error','Échec de connexion', e.message); }
  App.loading = false; render();
};
App.register = async function(){
  const full_name = val('reg-name'), email = val('reg-email'), password = val('reg-pass'), password2 = val('reg-pass2');
  if (!full_name || !email || !password){ notify('error','Champs requis','Remplissez tous les champs'); return; }
  if (password !== password2){ notify('error','Mots de passe différents','Vérifiez la confirmation'); return; }
  App.loading = true; render();
  try {
    await api('/register', { method:'POST', body:{ full_name, email, password }, withAuth:false });
    notify('success','Compte créé','Vous pouvez maintenant vous connecter');
    App.route = 'login';
  } catch(e){ notify('error','Échec inscription', e.message); }
  App.loading = false; render();
};
App.logout = async function(){
  try { await api('/logout', { method:'POST' }); } catch(e){}
  clearSession(); App.user=null; App.roles=[];
  App.route='login'; render();
};
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }
function valNum(id){ const v = val(id); return v === '' ? null : Number(v); }

App.loadDatabases = async function(){
  try {
    const data = await api('/databases?include_archived=true');
    App.databases = data || [];
  } catch(e){ notify('error','Erreur', e.message); App.databases = []; }
  render();
};
function renderDashboard(){
  const u = App.user || {};
  const filtered = App.databases.filter(d => {
    const okSearch = !App.search || (d.name||'').toLowerCase().includes(App.search.toLowerCase());
    const okScope = App.scopeFilter==='all' || d.scope===App.scopeFilter;
    return okSearch && okScope;
  });
  let cards = '';
  if (App.databases.length === 0){
    cards = '<div class="empty-state">'+IC.search+'<div class="es-title">Aucune base</div><div class="es-desc">Créez votre première base ou importez un fichier XML/SQL.</div></div>';
  } else if (filtered.length === 0){
    cards = '<div class="empty-state">'+IC.search+'<div class="es-title">Aucun résultat</div><div class="es-desc">Aucune base ne correspond aux filtres.</div></div>';
  } else {
    cards = '<div class="db-grid">' + filtered.map(d => {
      const archived = d.status === 'ARCHIVED';
      const canManage = d.access && d.access.can_admin;
      const canWrite = d.access && d.access.can_write;
      const level = accessLevel(d);
      return '<div class="db-card '+(archived?'archived':'')+'">' +
        '<div class="db-card-top">' +

            '<div class="ctx-menu" id="ctx-'+d.id+'">' +
              (canWrite ? '<button onclick="App.editDb('+d.id+')">'+IC.edit+'Modifier</button>' : '') +
              (canManage ? '<button onclick="App.duplicateDb('+d.id+')">'+IC.copy+'Dupliquer</button>' : '') +
              (canManage ? '<button onclick="App.exportFull('+d.id+')">'+IC.down+'Export complet XMLForge</button>' : '') +
              (canManage ? '<button onclick="App.openDbAccess('+d.id+')">'+IC.group+'Gérer les accès</button>' : '') +
              (canManage ? '<hr/>' : '') +
              (canManage ? '<button onclick="App.toggleArchiveDb('+d.id+')">'+(archived?'Restaurer':'Archiver')+'</button>' : '') +
              (canManage ? '<hr/>' : '') +
              (canManage ? '<button class="danger" onclick="App.deleteDb('+d.id+')">'+IC.trash+'Supprimer</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<h3>'+esc(d.name)+'</h3><p class="desc">'+esc(d.description||'Aucune description')+'</p>' +
        '<div class="meta"><span>'+(d.tables_count||0)+' tables</span><span class="dim">·</span><span>Propriétaire : '+(d.owner_name||d.creator_name||'—')+'</span></div>' +
        '<div class="meta"><span class="dim">Accès '+level+'</span></div>' +
        '<div class="db-card-footer">' +
          '<div class="db-card-badges">' +
            '<span class="badge '+(archived?'badge-gray':'badge-green')+'"><span class="badge-dot" style="background:'+(archived?'#A0AEC0':'#22C55E')+'"></span>'+(archived?'ARCHIVÉ':'ACTIF')+'</span>' +
            '<span class="badge '+(d.scope==='COMMON'?'badge-warn':'badge-blue')+'">'+(d.scope==='COMMON'?'Commune':'Personnelle')+'</span>' +
          '</div>' +
          '<a class="db-card-open" onclick="App.openDb('+d.id+')">Ouvrir '+IC.arrow+'</a>' +

      '<div class="topbar">' +

        '<div class="topbar-right"><span class="badge badge-green"><span class="badge-dot" style="background:#22C55E"></span>Connecté</span><div class="avatar">'+initials()+'</div></div>' +
      '</div>' +

          '<div><h1>Mes bases de données</h1><p>'+(filtered.length)+' base(s)'+(App.scopeFilter==='PERSONAL'?' personnelles':App.scopeFilter==='COMMON'?' communes':'')+' · synchronisées avec XMLForge</p></div>' +
          '<div class="dash-actions">' +

function renderDashboardOnly(){

App.openNewDb = function(){

      '<div class="field-block"><label class="form-label">Description</label><input class="form-input" id="ndb-desc" placeholder="Description"/></div>' +
      '<div class="field-block"><label class="form-label">Visibilité</label><select class="form-input" id="ndb-scope"><option value="PERSONAL">PERSONAL — privée</option><option value="COMMON">COMMON — partageable par permissions</option></select></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="App.createDb()">Créer la base</button></div>');

App.createDb = async function(){
  const name = val('ndb-name').trim();
  if (!name){ notify('error','Nom requis','Saisissez un nom'); return; }
  try {
    await api('/databases', { method:'POST', body:{ name, description: val('ndb-desc').trim(), scope: val('ndb-scope') } });
    closeModal(); notify('success','Base créée','« '+name+' » créée');
    await App.loadDatabases();
  } catch(e){ notify('error','Erreur création', e.message); }
};
App.editDb = function(id){
  const d = App.databases.find(x=>x.id===id); if(!d) return;
  if (d.status==='ARCHIVED'){ notify('error','Archivée','Restaurez d\'abord'); return; }
  openModal('<div class="modal-head"><h3>'+IC.edit+'Modifier la base</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="field-block"><label class="form-label">Nom</label><input class="form-input" id="edb-name" value="'+esc(d.name)+'"/></div>' +
      '<div class="field-block"><label class="form-label">Description</label><input class="form-input" id="edb-desc" value="'+esc(d.description||'')+'"/></div>' +
      '<div class="field-block"><label class="form-label">Portée</label><select class="form-input" id="edb-scope" '+(d.access && d.access.can_admin?'':'disabled')+'><option value="PERSONAL" '+(d.scope==='PERSONAL'?'selected':'')+'>PERSONAL</option><option value="COMMON" '+(d.scope==='COMMON'?'selected':'')+'>COMMON</option></select></div>' +
      '<div class="info-box">'+IC.info+'<span>Le backend exige le droit <b>admin</b> pour changer la portée. Un utilisateur EDIT peut renommer/décrire.</span></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="App.saveEditDb('+d.id+')">Enregistrer</button></div>', true);
};
App.saveEditDb = async function(id){
  const d = App.databases.find(x=>x.id===id);
  const payload = { name: val('edb-name').trim(), description: val('edb-desc').trim() };
  if (d && d.access && d.access.can_admin) payload.scope = val('edb-scope');
  try {
    await api('/databases/'+id, { method:'PUT', body:{ ...payload, expected_version: d ? d.document_version : null } });
    closeModal(); notify('success','Base mise à jour','');
    await App.loadDatabases();
  } catch(e){
    if (e.isConflict) openConflict();
    else notify('error','Erreur', e.message);
  }
};
App.toggleArchiveDb = async function(id){
  const d = App.databases.find(x=>x.id===id);
  try {
    await api('/databases/'+id+'/'+(d.status==='ARCHIVED'?'restore':'archive'), { method:'POST', body:{} });
    notify(d.status==='ARCHIVED'?'success':'info', d.status==='ARCHIVED'?'Restaurée':'Archivée', '« '+d.name+' »');
    await App.loadDatabases();
  } catch(e){ notify('error','Erreur', e.message); }
};
App.deleteDb = async function(id){
  const d = App.databases.find(x=>x.id===id);
  if (!window.confirm('Supprimer définitivement « '+d.name+' » ?')) return;
  try {
    await api('/databases/'+id, { method:'DELETE' });
    notify('error','Supprimée','« '+d.name+' » supprimée');
    await App.loadDatabases();
  } catch(e){ notify('error','Erreur', e.message); }
};
App.duplicateDb = async function(id){
  const d = App.databases.find(x=>x.id===id);
  try {
    const res = await api('/export/xml/'+id);
    const base = String(d.name||'base').replace(/[^A-Za-z0-9_]/g,'_').replace(/^[^A-Za-z_]/,'_');
    await api('/import/xml', { method:'POST', body:{ xml: res.xml, database_name: base+'_copie' } });
    notify('success','Dupliquée','Copie de « '+d.name+' » créée');
    await App.loadDatabases();
  } catch(e){ notify('error','Erreur', e.message); }
};

/* --- Import (XML / SQL / Projet) --- */
App.openImport = function(){
  App.importKind = 'xml';
  openModal('<div class="modal-head"><h3>'+IC.down+'Importer une base</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="tabs-seg" style="margin-bottom:16px">' +
        '<button class="tab-btn active" id="imp-xml" onclick="App.setImportKind(\'xml\')">XML (structure)</button>' +
        '<button class="tab-btn" id="imp-sql" onclick="App.setImportKind(\'sql\')">SQL (script)</button>' +
        '<button class="tab-btn" id="imp-project" onclick="App.setImportKind(\'project\')">Projet XMLForge</button>' +
      '</div>' +
      '<p class="desc" id="imp-desc">Analyse un fichier XMLForge décrivant tables, colonnes et données. La base est créée avec le nom du document.</p>' +
      '<div class="dropzone" id="imp-drop" onclick="document.getElementById(\'imp-file\').click()"><b>Cliquer</b> ou glisser un fichier</div>' +
      '<input type="file" id="imp-file" class="hidden" accept=".xml" onchange="App.importFile(this.files[0])"/>' +
      '<div class="import-progress hidden" id="imp-progress"><span class="mini-spinner"></span>Import...</div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="document.getElementById(\'imp-file\').click()">Importer</button></div>');
  const dz = document.getElementById('imp-drop');
  dz.addEventListener('dragover', e=>{e.preventDefault();dz.classList.add('dragover')});
  dz.addEventListener('dragleave', ()=>{dz.classList.remove('dragover')});
  dz.addEventListener('drop', e=>{e.preventDefault();dz.classList.remove('dragover');App.importFile(e.dataTransfer.files[0])});
};
App.setImportKind = function(kind){
  App.importKind = kind;
  ['imp-xml','imp-sql','imp-project'].forEach(id=>document.getElementById(id).classList.toggle('active', id==='imp-'+kind));
  document.getElementById('imp-file').accept = (kind==='sql'?'.sql':'.xml');
  document.getElementById('imp-desc').textContent =
    kind==='xml' ? 'Analyse un fichier XMLForge décrivant tables, colonnes et données. La base est créée avec le nom du document.' :
    kind==='sql' ? 'Convertit un script SQL (CREATE TABLE + INSERT) en XML puis crée la base. Limitations du parseur SQL documentées.' :
    'Importe un export complet XMLForge (structure + données + métadonnées). Nécessite un export projet généré par XMLForge.';
};
App.importFile = async function(file){
  if (!file) return;
  document.getElementById('imp-progress').classList.remove('hidden');
  try {
    if (App.importKind==='sql') await api('/import/sql', { method:'POST', body: buildForm(file) });
    else if (App.importKind==='project') await api('/import/project', { method:'POST', body: buildForm(file) });
    else await api('/import/xml', { method:'POST', body: buildForm(file) });
    closeModal(); notify('success','Import réussi','Nouvelle base créée');
    await App.loadDatabases();
  } catch(e){ notify('error','Erreur import', e.message); }
};
function buildForm(file){
  const fd = new FormData(); fd.append('file', file); return fd;
}

    '</div>' +

App.loadDbPermissions = async function(){
  try {
    App.dbPermissions = await api('/databases/'+App.dbAccessId+'/permissions');
  } catch(e){ App.dbPermissions = []; }
  const el = document.getElementById('acc-list');
  if (!el) return;
  if (App.dbPermissions.length===0) el.innerHTML = '<div class="empty-state" style="padding:20px"><div class="es-title">Aucun partage</div></div>';
  else el.innerHTML = App.dbPermissions.map(p =>
    '<div class="rel-row"><span class="rel-row-col">'+esc(p.user_email||('User #'+p.user_id))+'</span>' +
    '<span class="badge badge-blue">'+levelBadge(p)+'</span>' +
    '<button class="icon-btn sm danger" style="margin-left:auto" onclick="App.revokeDbAccess('+p.user_id+')">✕</button></div>').join('');
};
App.grantDbAccess = async function(){
  const email = val('acc-email').trim(); const level = val('acc-level');
  if (!email) return;
  const rights = level==='MANAGE' ? {can_read:true,can_write:true,can_ddl:true,can_admin:true}
    : level==='EDIT' ? {can_read:true,can_write:true,can_ddl:true,can_admin:false}
    : {can_read:true,can_write:false,can_ddl:false,can_admin:false};
  try {
    await api('/databases/'+App.dbAccessId+'/permissions', { method:'POST', body:{ email, ...rights } });
    notify('success','Accès partagé', level+' accordé');
    document.getElementById('acc-email').value='';
    await App.loadDbPermissions();
  } catch(e){ notify('error','Partage impossible', e.message); }
};
App.revokeDbAccess = async function(userId){
  try {
    await api('/databases/'+App.dbAccessId+'/permissions/'+userId, { method:'DELETE' });
    await App.loadDbPermissions();
  } catch(e){ notify('error','Retrait impossible', e.message); }
};

/* ============================================================
   WORKSPACE
============================================================ */
App.openDb = function(id){ App.dbId = id; App.route='workspace'; App.loadWorkspace(); };
App.loadWorkspace = async function(){
  render();
  try {
    App.db = await api('/databases/'+App.dbId);
    App.documentVersion = App.db.document_version;
    App.tables = await api('/tables/'+App.dbId+'?include_archived=true');
    App.currentTable = App.tables.length ? App.tables[0] : null;
    await App.loadTable();
  } catch(e){ notify('error','Erreur base', e.message); }
  render();
};
App.loadTable = async function(){
  if (!App.currentTable){ App.columns=[]; App.rows=[]; App.xmlCode=''; App.sqlCode=''; return; }
  const t = App.currentTable;
  App.columns = await api('/columns/'+t.id+'?include_archived=true');
  App.page = 1;
  await App.loadRows();
  App.xmlCode = ''; App.sqlCode = '';
  try {
    const xres = await api('/export/table-xml/'+t.id);
    App.xmlCode = xres.xml || '';
    if (xres.document_version != null) App.documentVersion = xres.document_version;
  } catch(e){ App.xmlError = e.message; App.xmlCode=''; }
  try {
    const sres = await api('/export/table-sql/'+t.id);
    App.sqlCode = sres.sql || '-- Aucun SQL';
  } catch(e){ App.sqlCode = '-- Erreur génération SQL'; }
};
App.loadRows = async function(){
  const t = App.currentTable; if(!t) return;
  const qs = new URLSearchParams({ limit:String(App.pageSize), offset:String((App.page-1)*App.pageSize) });
  if (App.rowSearch) qs.set('search', App.rowSearch);
  if (App.rowSort) qs.set('sort', App.rowSort);
  if (App.rowOrder) qs.set('order', App.rowOrder);
  try {
    const res = await api('/tables/'+t.id+'/rows?'+qs.toString());
    App.rows = res.rows || []; App.rowsTotal = res.total || 0;
  } catch(e){ App.rows = []; App.rowsTotal = 0; App.rowsError = e.message; }
};
App.selectTable = function(id){
  App.currentTable = App.tables.find(t=>t.id===id) || null;
  App.tab='structure';
  App.loadTable().then(()=>render());
};

function tableAccess(){
  const t = App.currentTable;
  return (t && t.access) || (App.db && App.db.access) || {};
}
function renderWorkspace(){
  const d = App.db, t = App.currentTable;
  const dbAccess = d ? d.access : {};
  const ta = tableAccess();
  const canWriteRows = !!ta.can_write;
  const canEditStructure = !!ta.can_ddl;
  const canManage = !!ta.can_admin;
  const unlocked = App.unlocked.indexOf(String(t && t.id)) !== -1;
  const canEditXml = canManage && (!t || !t.is_protected || unlocked);
  const pk = App.columns.find(c=>c.primary_key);

  // Liste des tables
  let tableList = '';
  if (App.tables.length===0){
    tableList = '<div class="empty-state" style="padding:20px"><div class="es-title" style="font-size:12px">Aucune table</div></div>';
  } else {
    tableList = App.tables.map(tb => {
      const act = t && tb.id===t.id;
      const un = !tb.is_protected || App.unlocked.indexOf(String(tb.id))!==-1;
      return '<a class="ws-table-item '+(act?'active':'')+'" onclick="App.selectTable('+tb.id+')">'+IC.table+
        '<span class="name-wrap"><span>'+esc(tb.name)+'</span>'+(tb.is_protected?'<span class="lock-ic '+(un?'unlocked':'')+'">'+(un?IC.unlock:IC.lock)+'</span>':'')+'</span>'+
        (tb.status==='ARCHIVED'?'<span class="arch-tag">ARCH</span>':'')+
        '<span class="count">'+(tb.columns_count||'')+'</span></a>';
    }).join('');
  }

  // Colonnes
  let colsRows = '';
  if (App.columns.length===0){
    colsRows = '<tr><td colspan="11"><div class="empty-state" style="padding:30px"><div class="es-title">Aucune colonne</div><div class="es-desc">Ajoutez votre première colonne.</div></div></td></tr>';
  } else {

      '<td>'+(c.primary_key?'<span class="pk-tag">PK</span>':'<span class="chip no">—</span>')+'</td>' +
      '<td>'+(c.foreign_key?'<span class="fk-tag" title="'+esc(c.references||'')+'">FK</span>':'<span class="chip no">—</span>')+'</td>' +
      '<td>'+boolChip(c.unique)+'</td>' +
      '<td>'+boolChip(c.auto_increment)+'</td>' +
      '<td><span class="badge '+(c.status==='ARCHIVED'?'badge-gray':'badge-green')+'">'+(c.status||'ACTIVE')+'</span></td>' +
      '<td style="font-size:11px;color:var(--text-tertiary)">'+esc(c.last_modified_by||'—')+'</td>' +
      '<td><div class="row-actions">' +
        '<button class="icon-btn sm" '+(canEditStructure?'':'disabled')+' onclick="App.editColumn('+c.id+')" title="Modifier">'+IC.edit+'</button>' +
        '<button class="icon-btn sm danger" '+(canEditStructure?'':'disabled')+' onclick="App.deleteColumn('+c.id+')" title="Supprimer">'+IC.trash+'</button>' +
      '</div></td></tr>').join('');

  // Lignes

        '<button class="btn btn-sm" '+(App.page<=1?'disabled':'')+' onclick="App.page--;App.loadRows().then(()=>render())">Précédent</button>' +
        '<button class="btn btn-sm" '+(App.page*App.pageSize>=App.rowsTotal?'disabled':'')+' onclick="App.page++;App.loadRows().then(()=>render())">Suivant</button>' +
      '</div>';

  // Relations

function boolChip(v){ return v ? '<span class="chip yes">'+IC.check+'</span>' : '<span class="chip no">—</span>'; }

/* --- Workspace : actions --- */
App.exportSqlDb = async function(){
  try { await apiBlob('/export/sql/'+App.dbId+'?download=true', (App.db?App.db.name:'database_'+App.dbId)+'.sql'); notify('success','Export SQL',''); }
  catch(e){ notify('error','Erreur', e.message); }
};
App.openWorkspaceImport = function(){
  openModal('<div class="modal-head"><h3>'+IC.down+'Importer un fichier XML</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body"><p class="desc">Synchronise la base actuelle depuis un fichier XML (remplace le document, gère expected_version).</p>' +
    '<div class="dropzone" id="ws-drop" onclick="document.getElementById(\'ws-file\').click()"><b>Cliquer</b> ou glisser .xml</div>' +
    '<input type="file" id="ws-file" class="hidden" accept=".xml" onchange="App.syncFromFile(this.files[0])"/></div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Annuler</button></div>');
  const dz=document.getElementById('ws-drop');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover')});
  dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');App.syncFromFile(e.dataTransfer.files[0])});
};
App.syncFromFile = async function(file){
  if(!file) return;
  const text = await file.text();
  try {
    const res = await api('/databases/'+App.dbId+'/sync-xml', { method:'POST', body:{ xml:text, expected_version: App.documentVersion } });
    if (res && res.document_version != null) App.documentVersion = res.document_version;
    closeModal(); notify('success','Import réussi','Base synchronisée');
    await App.loadWorkspace();
  } catch(e){
    if (e.isConflict) openConflict();
    else notify('error','Erreur import', e.message);
  }
};
App.openNewTable = function(){
  App.newTableForm = { name:'', withId:true, protected:false, key:'' };
  openModal('<div class="modal-head"><h3>'+IC.table+'Nouvelle table</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="field-block"><label class="form-label">Nom de la table</label><input class="form-input" id="nt-name" placeholder="ex. commande"/></div>' +
      '<div class="check-row"><label class="switch"><input type="checkbox" id="nt-id" checked/><span class="track"></span></label><label>Ajouter automatiquement une clé primaire "id"</label></div>' +
      '<div class="check-row"><label class="switch"><input type="checkbox" id="nt-prot" onchange="document.getElementById(\'nt-key-box\').style.display=this.checked?\'block\':\'none\'"/><span class="track"></span></label><label>Table protégée</label></div>' +
      '<div class="field-block" id="nt-key-box" style="display:none;margin-top:10px"><label class="form-label">Code de protection</label><input class="form-input mono" id="nt-key" placeholder="XML-9F4A-2C1B"/></div>' +
    '</div>' +

App.createTable = async function(){
  const name = val('nt-name').trim();
  const protectedTable = document.getElementById('nt-prot').checked;
  const key = val('nt-key').trim();
  if (!name){ notify('error','Nom requis',''); return; }
  if (protectedTable && !key){ notify('error','Code requis','Le backend ne génère pas le code de protection.'); return; }
  try {
    const table = await api('/tables', { method:'POST', body:{ name, database_id: App.dbId, is_protected: protectedTable, file_identifier: key || null, expected_version: App.documentVersion } });
    let latest = await api('/databases/'+App.dbId);
    if (protectedTable && key){ await api('/unlock-table', { method:'POST', body:{ table_id: table.id, key_identifier: key } }); App.unlocked.push(String(table.id)); }
    if (document.getElementById('nt-id').checked){
      await api('/columns', { method:'POST', body:{ name:'id', type:'INT', length:'11', nullable:false, primary_key:true, auto_increment:true, unique:false, foreign_key:false, index:false, table_id: table.id, expected_version: latest.document_version } });
      latest = await api('/databases/'+App.dbId);
    }
    App.documentVersion = latest.document_version;
    closeModal(); notify('success','Table créée','« '+name+' » ajoutée');
    await App.loadWorkspace();
  } catch(e){
    if (e.isConflict) openConflict();
    else notify('error','Erreur création', e.message);
  }
};
App.deleteTable = function(){
  const t = App.currentTable;
  if (!t){ notify('error','Aucune table',''); return; }
  if (!App.requireUnlocked()) return;
  if (!window.confirm('Supprimer définitivement « '+t.name+' » ?')) return;
  App.doDeleteTable();
};

  } catch(e){
    if (e.status===403) App.openUnlock();

  }
};

  const f = App.colForm;

function sw(id,label,checked){ return '<div class="check-row"><label class="switch"><input type="checkbox" id="'+id+'" '+(checked?'checked':'')+'/><span class="track"></span></label><label>'+label+'</label></div>'; }
function fkActions(cur){

App.saveColumn = async function(){

App.toggleNull = function(colName){
  const cur = App.rowForm[colName];
  App.rowForm[colName] = (cur === null) ? '' : null;

  if (input){
    input.value = '';
    input.disabled = App.rowForm[colName] === null;
  }

App.saveRow = async function(rowId){

  });
  try {
    if (rowId == null) await api('/tables/'+t.id+'/rows', { method:'POST', body:{ data: payload, expected_version: App.documentVersion } });
    else await api('/tables/'+t.id+'/rows/'+rowId, { method:'PUT', body:{ data: payload, expected_version: App.documentVersion } });

};

/* --- Protection / déverrouillage --- */
App.requireUnlocked = function(){
  const t = App.currentTable;
  if (t && t.is_protected && App.unlocked.indexOf(String(t.id))===-1){ App.openUnlock(); return false; }
  return true;
};
App.openUnlock = function(){
  const t = App.currentTable;
  openModal('<div class="modal-head"><h3>'+IC.lock+'Table protégée</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="info-box">'+IC.info+'<span>Table <b style="color:#fff">'+esc(t?t.name:'')+'</b> protégée. Déverrouillage <b>personnel</b> (session utilisateur). Autres utilisateurs devront fournir la clé.</span></div>' +
      '<div class="field-block"><label class="form-label">Clé de protection</label><input class="form-input mono" id="unlock-key" placeholder="XML-..."/></div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="App.unlock()">Déverrouiller pour moi</button></div>');
};
App.unlock = async function(){
  const t = App.currentTable;
  const key = val('unlock-key').trim();
  if (!key){ notify('error','Clé requise',''); return; }
  try {
    await api('/unlock-table', { method:'POST', body:{ table_id: t.id, key_identifier: key } });
    App.unlocked.push(String(t.id));
    closeModal(); notify('success','Déverrouillée','Accès personnel (session)');
    await App.loadTable(); render();
  } catch(e){ notify('error','Clé invalide', e.message); }
};
App.openProtect = function(){
  openModal('<div class="modal-head"><h3>'+IC.lock+'Protéger table</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body"><div class="field-block"><label class="form-label">File Identifier</label><input class="form-input mono" id="protect-key" placeholder="XML-..."/></div></div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="App.protect()">Protéger</button></div>');
};
App.protect = async function(){
  const t = App.currentTable;
  const key = val('protect-key').trim();
  if (!key){ notify('error','Clé requise',''); return; }
  try {
    await api('/tables/'+t.id, { method:'PUT', body:{ is_protected:true, file_identifier:key, expected_version: App.documentVersion } });

    else notify('error','Erreur', e.message);
  }
};
App.unprotect = async function(){
  const t = App.currentTable;
  if (!window.confirm('Retirer la protection de « '+t.name+' » ?')) return;

    await api('/tables/'+t.id, { method:'PUT', body:{ is_protected:false, file_identifier:null, expected_version: App.documentVersion } });

    else notify('error','Erreur', e.message);
  }
};

/* --- Partage de table --- */
App.openTableAccess = function(){
  const t = App.currentTable;
  App.tablePermissions = [];
  openModal('<div class="modal-head"><h3>'+IC.group+'Partage de la table '+esc(t?t.name:'')+'</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body">' +
      '<p class="desc">Les droits de table sont <b>additifs</b> par rapport à ceux de la base : ils ne retirent jamais un droit. Un partage de table seul ne rend pas la base sélectionnable ; accordez au moins la lecture sur la base si nécessaire.</p>' +
      '<div class="grid-2"><input class="form-input" id="tacc-email" type="email" placeholder="utilisateur@exemple.com"/><select class="form-input" id="tacc-level"><option>VIEW</option><option>EDIT</option><option>MANAGE</option></select></div>' +
      '<button class="btn btn-primary" style="margin-top:12px" onclick="App.grantTableAccess()">Accorder</button>' +
      '<div style="margin-top:18px" id="tacc-list"><span class="mini-spinner"></span> Chargement...</div>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Fermer</button></div>', true);
  App.loadTablePermissions();
};
App.loadTablePermissions = async function(){
  const t = App.currentTable;
  try { App.tablePermissions = await api('/tables/'+t.id+'/permissions'); } catch(e){ App.tablePermissions=[]; }
  const el = document.getElementById('tacc-list');
  if (!el) return;
  el.innerHTML = App.tablePermissions.length===0 ? '<div class="empty-state" style="padding:20px"><div class="es-title">Aucun partage</div></div>'
    : App.tablePermissions.map(p=>'<div class="rel-row"><span class="rel-row-col">'+esc(p.user_email||('User #'+p.user_id))+'</span><span class="badge badge-blue">'+levelBadge(p)+'</span><button class="icon-btn sm danger" style="margin-left:auto" onclick="App.revokeTableAccess('+p.user_id+')">✕</button></div>').join('');
};
App.grantTableAccess = async function(){
  const t = App.currentTable;
  const email = val('tacc-email').trim(); const level = val('tacc-level');
  if (!email) return;
  const rights = level==='MANAGE' ? {can_read:true,can_write:true,can_ddl:true,can_admin:true}
    : level==='EDIT' ? {can_read:true,can_write:true,can_ddl:true,can_admin:false}
    : {can_read:true,can_write:false,can_ddl:false,can_admin:false};
  try {
    await api('/tables/'+t.id+'/permissions', { method:'POST', body:{ email, ...rights } });
    notify('success','Accès table partagé', level+' accordé');
    document.getElementById('tacc-email').value='';
    await App.loadTablePermissions();
  } catch(e){ notify('error','Partage impossible', e.message); }
};
App.revokeTableAccess = async function(userId){
  const t = App.currentTable;
  try { await api('/tables/'+t.id+'/permissions/'+userId, { method:'DELETE' }); await App.loadTablePermissions(); }
  catch(e){ notify('error','Retrait impossible', e.message); }
};

App.downloadText = function(content, filename){
  const blob = new Blob([content||''], { type:'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  notify('success','Téléchargé', filename);
};

/* --- Conflit 409 --- */
function openConflict(){
  openModal('<div class="modal-head"><h3>Conflit de version</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
    '<div class="modal-body">' +
      '<div class="danger-box"><b>Cette base a été modifiée depuis votre dernière synchronisation.</b><br/>Vos changements n\'ont pas écrasé la version plus récente.</div>' +
      '<p class="desc">Rechargez les données avant de recommencer, ou abandonnez vos modifications locales.</p>' +
    '</div>' +
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Abandonner</button><button class="btn btn-primary" onclick="closeModal();App.loadWorkspace()">Recharger la version récente</button></div>');
}

App.openUserReset = function(id){

  } catch(e){ notify('error','Erreur', e.message); }

App.toggleUserActive = async function(id){

App.deleteUser = async function(id){

    await api('/users/'+id, { method:'DELETE' });

/* ============================================================
   AUDIT (ADMIN)
============================================================ */
App.loadAudit = async function(){
  try { App.audit = await api('/audit-logs?limit=200'); } catch(e){ App.audit=[]; notify('error','Erreur',e.message); }
  render();
};
function auditBadge(action){
  action = action || '';
  if (action.startsWith('SUPPRESSION') || action.includes('ERREUR')) return 'badge-red';
  if (action.startsWith('CONVERSION')) return 'badge-blue';
  if (action === 'DECONNEXION') return 'badge-gray';
  return 'badge-green';
}
function renderAudit(){
  const filter = App.auditFilter || 'all';
  const logs = (App.audit||[]).filter(a => filter==='all' || (a.action||'').toUpperCase().includes(filter.toUpperCase()));
  let rows = '';
  if (!App.audit) rows = '<tr><td colspan="6"><div class="skeleton" style="height:20px"></div></td></tr>';
  else if (logs.length===0) rows = '<tr><td colspan="6"><div class="empty-state"><div class="es-title">Aucun log</div><div class="es-desc">Aucune entrée ne correspond à ce filtre.</div></div></td></tr>';
  else rows = logs.map(a =>
    '<tr><td class="date-cell">'+(a.timestamp?new Date(a.timestamp).toLocaleString('fr-FR'):a.created_at?new Date(a.created_at).toLocaleString('fr-FR'):'—')+'</td>' +
    '<td>'+esc(a.user_name||'—')+'</td>' +
    '<td><span class="badge '+auditBadge(a.action)+'">'+esc(a.action)+'</span></td>' +
    '<td>'+esc(a.element_name||a.element_type||'—')+'</td>' +
    '<td style="color:var(--text-secondary)">'+esc(a.description||'—')+'</td>' +
    '<td class="ip-cell">'+esc(a.ip_address||'—')+'</td></tr>').join('');
  return '<div class="screen active" id="screen-audit">'+sidebar('audit')+
    '<div class="dash-main">' +
      '<div class="page-header"><a class="back-link" onclick="navigate(\'dashboard\')">'+IC.back+'Bases de données</a></div>' +
      '<div class="dash-content">' +
        '<div class="dash-head"><div><h1>Audit</h1><p>Journal indépendant de toutes les actions du système</p></div>' +
        '<div class="filters-bar"><select class="form-input" style="width:auto" onchange="App.auditFilter=this.value;render()"><option value="all">Toutes les actions</option><option value="CONNEXION">Connexion</option><option value="CREATION">Création</option><option value="SUPPRESSION">Suppression</option><option value="IMPORT">Import</option><option value="EXPORT">Export</option><option value="CONVERSION">Conversion</option><option value="ERREUR">Erreur</option></select><button class="btn btn-sm" onclick="App.loadAudit()">Actualiser</button></div></div>' +
        '<div style="border:1px solid var(--border);border-radius:var(--radius);overflow:auto;background:var(--card)"><table class="audit-table"><thead><tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Élément</th><th>Description</th><th>IP</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
      '</div>' +
    '</div></div>';
}

/* ============================================================
   HISTORIQUE (ADMIN)
============================================================ */
App.loadHistory = async function(){
  try { App.history = await api('/history?limit=200'); } catch(e){ App.history=[]; notify('error','Erreur',e.message); }
  render();
};
function renderHistory(){
  const items = App.history || [];
  if (!App.history){
    return '<div class="screen active" id="screen-history">'+sidebar('history')+'<div class="dash-main"><div class="page-header"><a class="back-link" onclick="navigate(\'dashboard\')">'+IC.back+'Bases de données</a></div><div class="dash-content"><div class="skeleton" style="height:80px"></div></div></div></div>';
  }
  if (items.length===0){
    return '<div class="screen active" id="screen-history">'+sidebar('history')+'<div class="dash-main"><div class="page-header"><a class="back-link" onclick="navigate(\'dashboard\')">'+IC.back+'Bases de données</a></div><div class="dash-content"><div class="dash-head"><div><h1>Historique</h1><p>Timeline des actions métier sur vos bases</p></div></div><div class="empty-state">'+IC.clock+'<div class="es-title">Aucun événement</div></div></div></div></div>';
  }
  const groups = {};
  items.forEach(h=>{
    const d = new Date(h.created_at||h.date||h.timestamp);
    const today = new Date(); const yest = new Date(); yest.setDate(today.getDate()-1);
    let label = d.toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
    if (d.toDateString()===today.toDateString()) label="Aujourd'hui";
    else if (d.toDateString()===yest.toDateString()) label='Hier';
    (groups[label]=groups[label]||[]).push(h);
  });
  let html = '';
  Object.entries(groups).forEach(([label,list])=>{
    html += '<div class="tl-group-label">'+esc(label)+'</div>';
    html += list.map(h=>{
      const tb = h.element_type==='base'?'badge-blue':h.element_type==='table'?'badge-green':h.element_type==='colonne'?'badge-warn':'badge-gray';
      const time = h.created_at ? new Date(h.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '';
      return '<div class="tl-card"><span class="tl-dot"></span><div class="tl-body">' +
        '<div class="tl-head"><span class="who">'+esc(h.user_name)+' '+esc(h.action_type)+' <b>'+esc(h.element_name)+'</b></span><span class="badge '+tb+'">'+esc(h.element_type)+'</span><span class="time">'+esc(time)+'</span></div>' +
        '<div class="tl-desc">'+esc(h.description||'')+'</div>' +
        '<div class="tl-meta-row">'+(h.database_id?'<span class="badge badge-blue">DB '+h.database_id+'</span>':'')+(h.table_id?'<span class="badge badge-gray">Table '+h.table_id+'</span>':'')+(h.ip_address?'<span class="mono">IP '+esc(h.ip_address)+'</span>':'')+'</div>' +
        '</div></div>';
    }).join('');
  });
  return '<div class="screen active" id="screen-history">'+sidebar('history')+
    '<div class="dash-main">' +
      '<div class="page-header"><a class="back-link" onclick="navigate(\'dashboard\')">'+IC.back+'Bases de données</a></div>' +
      '<div class="dash-content">' +
        '<div class="dash-head"><div><h1>Historique</h1><p>Timeline des actions métier effectuées sur vos bases</p></div><button class="btn btn-sm" onclick="App.loadHistory()">Actualiser</button></div>' +
        html +
      '</div>' +
    '</div></div>';
}

/* ============================================================

============================================================ */
App.loadTcp = async function(){
  App.tcp = { credentials:null, sessions:[], status:null, error:null };
  try { App.tcp.status = await api('/tcp/status', { withAuth:false }); } catch(e){ App.tcp.error = e.message; }
  try { App.tcp.credentials = await api('/tcp/credentials'); } catch(e){}
  try { const s = await api('/tcp/sessions'); App.tcp.sessions = s.sessions || []; } catch(e){}
  render();
};
function renderSettings(){
  const tcp = App.tcp || {};
  const cred = tcp.credentials;
  let tcpHtml = '<div class="api-card"><span class="mini-spinner"></span> Chargement des informations TCP...</div>';
  if (tcp.status){
    tcpHtml = '<div class="api-card">' +
      '<div class="info-box" style="margin-bottom:14px">'+(tcp.status.running?'<span style="display:flex;gap:10px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></span>Serveur TCP '+(tcp.status.running?'actif':'indisponible')+' · '+esc(tcp.status.host||'—')+':'+esc(tcp.status.port)+' · '+(tcp.status.active_sessions||0)+' session(s)' : '<span>Serveur TCP indisponible</span>')+'</div>' +
      '<div class="api-grid">' +
        '<div><div class="api-field-label">Hôte</div><div class="api-field-value">'+esc(cred ? cred.tcp_host : tcp.status.host || '—')+'</div></div>' +
        '<div><div class="api-field-label">Port</div><div class="api-field-value">'+esc(cred ? cred.tcp_port : tcp.status.port)+'</div></div>' +
        '<div><div class="api-field-label">Utilisateur TCP</div><div class="api-field-value">'+esc(cred ? cred.tcp_username : '—')+'</div></div>' +
        '<div><div class="api-field-label">État</div><div class="api-field-value">'+(cred ? (cred.is_active?'<span class="badge badge-green">ACTIF</span>':'<span class="badge badge-gray">INACTIF</span>') : '—')+'</div></div>' +
      '</div>' +
      (cred && tcp.plain_password ?
        '<div class="danger-box" style="margin-top:14px"><b>Conservez ce mot de passe affiché une seule fois.</b><br/><span class="mono">'+esc(tcp.plain_password)+'</span></div>' : '') +
      '<div class="field-block" style="margin-top:14px"><label class="form-label">Mot de passe XMLForge (pour régénérer un secret affichable)</label><div style="display:flex;gap:8px"><input class="form-input" id="tcp-pwd" type="password" placeholder="Mot de passe web actuel"/><button class="btn btn-primary" onclick="App.revealTcp()">Générer</button></div></div>' +
      '<button class="btn btn-sm" style="margin-top:8px" onclick="App.regenerateTcp()">Régénérer sans confirmation</button>' +
      '<div style="margin-top:16px"><label class="form-label">Exemple client Python fourni par XMLForge</label>' +
      '<div class="tcp-box">from app.tcp import XMLForgeClient\n\nclient = XMLForgeClient(\''+esc(cred?cred.tcp_host:'127.0.0.1')+'\', '+esc(cred?cred.tcp_port:3307)+')\nclient.connect(\''+esc(cred?cred.tcp_username:'USER')+'\', \'YOUR_TCP_PASSWORD\', database=\'DATABASE_ID\')\nrows = client.select(\'your_table\')\nclient.disconnect()</div></div>' +
      '<p style="font-size:12px;color:var(--text-secondary);margin-top:12px">L\'identifiant de base est l\'ID affiché dans l\'URL de l\'espace de travail (<span class="mono">/database/&lt;id&gt;</span>). Le mot de passe TCP est distinct du mot de passe web. Node.js et HTTP/cURL ne sont pas disponibles sur le port TCP.</p>' +
      '<div style="margin-top:16px"><label class="form-label">Sessions TCP actives</label>' +
        ((tcp.sessions||[]).length===0 ? '<div class="empty-state" style="padding:16px"><div class="es-desc">Aucune session active.</div></div>'
          : (tcp.sessions||[]).map(s=>'<div class="rel-row"><span class="rel-row-col">'+esc(s.database||'Sans base')+'</span><span class="mono" style="color:var(--text-tertiary)">'+esc(s.connected_at||'')+'</span></div>').join('')) +
      '</div>' +
    '</div>';
  }
  const endpoints = [
    ['POST','/api/register','Inscription (rôle USER par défaut)'],['POST','/api/login','Connexion (JWT)'],['GET','/api/me','Profil connecté'],['POST','/api/logout','Révocation du token'],
    ['GET','/api/databases','Bases accessibles'],['POST','/api/databases','Création (PERSONAL/COMMON)'],['PUT','/api/databases/:id','Renommage / scope'],['DELETE','/api/databases/:id','Suppression (admin)'],
    ['POST','/api/databases/:id/query','SQL SELECT/INSERT/UPDATE/DELETE'],['POST','/api/databases/:id/sync-xml','Synchronisation depuis XML'],
    ['GET','/api/databases/:id/permissions','Partages de la base'],['POST','/api/databases/:id/permissions','Partager (VIEW/EDIT/MANAGE)'],
    ['GET','/api/tables/:databaseId','Tables'],['POST','/api/tables','Création de table'],['PUT','/api/tables/:id','Modification'],['DELETE','/api/tables/:id','Suppression'],
    ['GET','/api/tables/:id/permissions','Permissions de la table'],['POST','/api/tables/:id/permissions','Partager une table'],
    ['GET','/api/tables/:id/rows','Lignes paginées'],['POST','/api/tables/:id/rows','Ajout de ligne'],['PUT','/api/tables/:id/rows/:rowId','Modification'],['DELETE','/api/tables/:id/rows/:rowId','Suppression'],
    ['GET','/api/columns/:tableId','Colonnes'],['POST','/api/columns','Création'],['PUT','/api/columns/:id','Modification'],['DELETE','/api/columns/:id','Suppression'],
    ['POST','/api/import/xml','Import XML'],['POST','/api/import/sql','Import SQL'],['POST','/api/import/project','Import projet'],
    ['GET','/api/export/xml/:id','Export XML (admin)'],['GET','/api/export/sql/:id','Export SQL'],['GET','/api/export/project/:id','Export projet'],
    ['POST','/api/convert/xml-to-sql','Conversion XML → SQL'],['POST','/api/convert/sql-to-xml','Conversion SQL → XML'],
    ['POST','/api/unlock-table','Déverrouillage table'],['GET','/api/unlocks','Déverrouillages session'],
    ['GET','/api/users','Utilisateurs (admin)'],['POST','/api/users/:id/reset-password','Reset mot de passe (admin)'],
    ['GET','/api/history','Historique (admin)'],['GET','/api/audit-logs','Audit (admin)'],
    ['GET','/api/tcp/status','Statut TCP (sans JWT)'],['GET','/api/tcp/credentials','Identifiants TCP'],['GET','/api/tcp/sessions','Sessions TCP'],
    ['GET','/health','Santé backend (sans JWT)']
  ];
  return '<div class="screen active" id="screen-settings">'+sidebar('api')+
    '<div class="dash-main">' +
      '<div class="page-header"><a class="back-link" onclick="navigate(\'dashboard\')">'+IC.back+'Bases de données</a></div>' +
      '<div class="dash-content">' +
        '<div class="dash-head"><div><h1>API & connexions externes</h1><p>Permet à des applications externes de se connecter à XMLForge</p></div></div>' +
        '<div class="rel-section-title">Connexion TCP/IP</div>' + tcpHtml +
        '<div class="rel-section-title">Clés API</div>' +
        '<div class="info-box">'+IC.info+'<span>Le backend actuel ne fournit pas de gestion de clés API. Aucun token fictif n\'est généré par le frontend.</span></div>' +
        '<div class="rel-section-title">Endpoints — référence</div>' +
        '<div class="endpoint-list">'+endpoints.map(([m,p,desc])=>
          '<div class="endpoint-row"><span class="badge '+(m==='POST'?'badge-green':m==='PUT'?'badge-warn':m==='DELETE'?'badge-red':'badge-blue')+'">'+m+'</span><span>'+p+'</span><span class="dim">'+desc+'</span></div>').join('')+'</div>' +
      '</div>' +
    '</div></div>';
}
App.revealTcp = async function(){
  const pwd = val('tcp-pwd');
  if (!pwd){ notify('error','Mot de passe requis',''); return; }
  try {
    const res = await api('/tcp/credentials/show-password', { method:'POST', body:{ current_password: pwd } });
    openModal('<div class="modal-head"><h3>'+IC.key+'Nouveau secret TCP</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
      '<div class="modal-body"><div class="danger-box">Conservez ce mot de passe, il n\'est affiché qu\'une fois.</div>' +
      '<div class="tcp-box">'+esc(res.password||'')+'</div></div>' +
      '<div class="modal-footer"><button class="btn" onclick="closeModal()">Fermer</button></div>');
    notify('success','Secret généré','');
    await App.loadTcp();
  } catch(e){ notify('error','Erreur', e.message); }
};
App.regenerateTcp = async function(){
  if (!window.confirm('Régénérer le mot de passe TCP ? Les anciennes connexions ne pourront plus se réauthentifier.')) return;
  try {
    const res = await api('/tcp/credentials/regenerate', { method:'POST', body:{} });
    openModal('<div class="modal-head"><h3>'+IC.key+'Nouveau secret TCP</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>' +
      '<div class="modal-body"><div class="danger-box">Conservez ce mot de passe, il n\'est affiché qu\'une fois.</div>' +
      '<div class="tcp-box">'+esc((res.plain_password)||'')+'</div></div>' +
      '<div class="modal-footer"><button class="btn" onclick="closeModal()">Fermer</button></div>');
    await App.loadTcp();
  } catch(e){ notify('error','Erreur', e.message); }
};

App.loadUnlocks = async function(){
  try {
    const unlocks = await api('/unlocks');
    App.unlocked = (unlocks||[]).filter(u=>!u.is_expired).map(u=>String(u.table_id));
  } catch(e){ App.unlocked = []; }
};
